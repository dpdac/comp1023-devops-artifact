name: CI Artifact Check

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check-artifact:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run artifact check script
        shell: cmd
        run: scripts\check_artifact.cmd
